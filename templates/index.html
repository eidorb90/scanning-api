<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
      :root {
        --bg: #111827;
        --bg-2: #0f172a;
        --ink: #ffffff;
        --muted: #cbd5e1;
        --line: #1e293b;
        --accent: #4f46e5;
        --accent-ink: #ffffff;
        --danger: #f87171;
        --danger-bg: rgba(248, 113, 113, 0.14);
        --ok: #c7d2fe;
        --ok-bg: rgba(99, 102, 241, 0.16);
        --shadow: 0 22px 50px rgba(0, 0, 0, 0.32);
        --font: "Outfit", ui-sans-serif, system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: var(--font);
        background: var(--bg);
        letter-spacing: -0.012em;
        color-scheme: dark;
      }

      body.is-viewer { overflow: hidden; }

      button, input, select { font-family: inherit; }

      a { color: inherit; }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.8rem 1.15rem;
        background: rgba(15, 23, 42, 0.84);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(16px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        color: inherit;
        text-decoration: none;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .mark { width: 1.9rem; height: 1.9rem; display: block; }

      .nav-desktop { display: flex; align-items: center; gap: 0.75rem; }

      .nav { display: flex; align-items: center; gap: 0.15rem; }

      .nav a, .nav-sheet a {
        color: var(--muted);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 0.45rem 0.72rem;
        border-radius: 999px;
      }

      .nav a[aria-current="page"],
      .nav a:hover,
      .nav-sheet a[aria-current="page"],
      .nav-sheet a:hover {
        color: var(--ink);
        background: #1e293b;
      }

      .nav-toggle { display: none; position: relative; }

      .nav-toggle summary {
        list-style: none;
        cursor: pointer;
        width: 2.4rem;
        height: 2.4rem;
        display: grid;
        place-items: center;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--ink);
      }

      .nav-toggle summary::-webkit-details-marker { display: none; }

      .nav-sheet {
        position: absolute;
        right: 0;
        top: calc(100% + 0.55rem);
        width: min(16rem, 78vw);
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        padding: 0.45rem;
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      .page {
        width: min(1080px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 2.4rem 0 4.5rem;
      }

      .page-narrow { width: min(760px, calc(100% - 2rem)); }

      .page-head { margin-bottom: 1.5rem; }

      h1 {
        margin: 0.15rem 0 0.45rem;
        font-size: clamp(2.1rem, 4vw, 3.4rem);
        line-height: 0.96;
        letter-spacing: -0.045em;
      }

      .lede { margin: 0; max-width: 38rem; color: var(--muted); font-size: 1.05rem; }

      .kicker, .section-label, .label {
        margin: 0;
        font-family: var(--mono);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .kicker, .section-label { color: #818cf8; }

      .label { color: var(--muted); }

      .dash, .split {
        display: grid;
        gap: 0.9rem;
      }

      .dash { grid-template-columns: repeat(2, minmax(0, 1fr)); }

      .split { grid-template-columns: 1.25fr 0.85fr; align-items: start; }

      .dash-card, .panel, .form-card {
        background: rgba(15, 23, 42, 0.94);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }

      .dash-card {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        min-height: 9.5rem;
        padding: 1.15rem 1.2rem 1.25rem;
        border-radius: 22px;
        text-decoration: none;
      }

      .dash-card strong { font-size: 1.35rem; letter-spacing: -0.03em; }

      .dash-card span:last-child { color: var(--muted); }

      .dash-card:hover, .row a:hover, .btn:hover { border-color: var(--accent); }

      .panel, .form-card { border-radius: 22px; }

      .panel { padding: 0.35rem 1.15rem; }

      .form-card { padding: 1.35rem 1.35rem 1.45rem; }

      .rows { list-style: none; margin: 0; padding: 0; }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.95rem 0;
        border-bottom: 1px solid var(--line);
      }

      .row:last-child { border-bottom: 0; }

      .row-name {
        font-family: var(--mono);
        font-size: 0.82rem;
        line-height: 1.45;
        word-break: break-word;
      }

      .empty { margin: 0; padding: 1.15rem 0.15rem; color: var(--muted); }

      .stack { display: flex; flex-direction: column; gap: 0.95rem; }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.9rem;
      }

      .span-2 { grid-column: 1 / -1; }

      .field { display: flex; flex-direction: column; gap: 0.4rem; }

      .section-break {
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        margin: 0;
        padding-top: 1.1rem;
        border-top: 1px solid var(--line);
      }

      input, select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #1e293b;
        color: var(--ink);
        font-size: 0.98rem;
        font-weight: 500;
        padding: 0.72rem 0.8rem;
      }

      input:focus, select:focus, button:focus-visible, a:focus-visible, summary:focus-visible {
        outline: 2px solid rgba(99, 102, 241, 0.7);
        outline-offset: 2px;
      }

      input[type="checkbox"] { width: auto; accent-color: var(--accent); }

      input[type="range"] {
        padding: 0;
        border: 0;
        background: transparent;
        accent-color: var(--accent);
      }

      input[type="file"] { padding: 0.5rem; font-size: 0.86rem; }

      input[type="file"]::file-selector-button {
        margin-right: 0.75rem;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-ink);
        font: 600 0.8rem/1 var(--font);
        padding: 0.55rem 0.8rem;
        cursor: pointer;
      }

      .btn, .row a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: var(--ink);
        text-decoration: none;
        font: 600 0.92rem/1 var(--font);
        padding: 0.72rem 1rem;
        cursor: pointer;
      }

      .btn-small, .row a { padding: 0.45rem 0.75rem; font-size: 0.82rem; }

      .btn-primary {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: transparent;
      }

      .btn-danger {
        background: var(--danger-bg);
        color: var(--danger);
        border-color: transparent;
      }

      .btn-block { width: 100%; }

      .logout-form, .auth-switch { margin: 0; }

      .auth-switch { color: var(--muted); font-size: 0.92rem; }

      .auth-switch a { color: #818cf8; }

      .auth {
        min-height: calc(100vh - 4.6rem);
        display: grid;
        place-items: center;
        padding: 2rem 1rem 3rem;
      }

      .auth-card { width: min(100%, 26rem); }

      .auth-card h1 { font-size: 2.3rem; }

      .notice { margin-top: 0.9rem; }

      .notice:empty { display: none; }

      .alert {
        border-radius: 14px;
        padding: 0.85rem 1rem;
      }

      .alert p { margin: 0.2rem 0; }

      .alert-ok { background: var(--ok-bg); color: var(--ok); }

      .alert-bad { background: var(--danger-bg); color: var(--danger); }

      .viewer-hud {
        position: fixed;
        z-index: 30;
        top: 5rem;
        left: 1rem;
        width: min(22.5rem, calc(100vw - 2rem));
        max-height: calc(100vh - 6.2rem);
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        padding: 1rem;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .viewer-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        cursor: pointer;
        list-style: none;
        font-weight: 600;
      }

      .viewer-toggle::-webkit-details-marker { display: none; }

      .viewer-toggle::after {
        content: "Show";
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .viewer-hud[open] .viewer-toggle::after { content: "Hide"; }

      .viewer-hud:not([open]) {
        width: max-content;
        max-width: calc(100vw - 1.5rem);
        max-height: none;
        right: auto;
        gap: 0;
      }

      .viewer-title {
        margin: 0;
        font-family: var(--mono);
        font-size: 0.95rem;
        font-weight: 500;
        line-height: 1.4;
        word-break: break-word;
      }

      .checks { display: flex; flex-direction: column; gap: 0.4rem; }

      .checks label { display: flex; align-items: center; gap: 0.5rem; }

      .hint, .stats { margin: 0; color: var(--muted); }

      .hint { font-size: 0.8rem; line-height: 1.45; }

      .stats { font-family: var(--mono); font-size: 0.75rem; line-height: 1.5; }

      @media (max-width: 800px) {
        .nav-desktop { display: none; }
        .nav-toggle { display: block; }
        .dash, .split, .grid-2 { grid-template-columns: 1fr; }
        .span-2 { grid-column: auto; }
        .viewer-hud {
          top: auto;
          right: 0.75rem;
          bottom: 0.75rem;
          left: 0.75rem;
          width: auto;
          max-height: 42vh;
          gap: 0.55rem;
          padding: 0.7rem 0.8rem;
        }

        .viewer-hud .btn,
        .viewer-hud .row a {
          padding: 0.4rem 0.65rem;
          font-size: 0.78rem;
        }

        .viewer-hud input,
        .viewer-hud select {
          padding: 0.42rem 0.55rem;
          font-size: 0.85rem;
        }

        .viewer-hud .hint { display: none; }
      }
    </style>
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <header class="topbar">
      <a class="brand" href="/">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#4f46e5"/>
          <path d="M9 16h14M16 9v14" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="16" cy="16" r="4.2" fill="none" stroke="#ffffff" stroke-width="1.6"/>
        </svg>
        BodeeScan
      </a>

      {% if username %}
      <div class="nav-desktop">
        <nav class="nav" aria-label="Main">
          <a data-nav href="/">Home</a>
          <a data-nav href="/videos/">Videos</a>
          <a data-nav href="/scans/">Scans</a>
          <a data-nav href="/meshes/">Meshes</a>
          <a data-nav href="/new-scan/">New scan</a>
        </nav>
        <form class="logout-form" action="/auth/logout/" method="post">
          <button class="btn btn-small" type="submit">Log out</button>
        </form>
      </div>
      <details class="nav-toggle">
        <summary aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </summary>
        <div class="nav-sheet">
          <a data-nav href="/">Home</a>
          <a data-nav href="/videos/">Videos</a>
          <a data-nav href="/scans/">Scans</a>
          <a data-nav href="/meshes/">Meshes</a>
          <a data-nav href="/new-scan/">New scan</a>
          <form class="logout-form" action="/auth/logout/" method="post">
            <button class="btn btn-block" type="submit">Log out</button>
          </form>
        </div>
      </details>
      {% else %}
      <div class="nav-desktop">
        <a class="btn btn-small" href="/login/">Log in</a>
        <a class="btn btn-small btn-primary" href="/signup/">Sign up</a>
      </div>
      <details class="nav-toggle">
        <summary aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </summary>
        <div class="nav-sheet">
          <a href="/login/">Log in</a>
          <a href="/signup/">Sign up</a>
        </div>
      </details>
      {% endif %}
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
    <script>
      (function () {
        var path = location.pathname.replace(/\/$/, "") || "/";
        document.querySelectorAll("[data-nav]").forEach(function (link) {
          var href = link.getAttribute("href").replace(/\/$/, "") || "/";
          if (href === path) link.setAttribute("aria-current", "page");
        });
        if (window.matchMedia("(min-width: 801px)").matches) {
          document.querySelectorAll("details.viewer-hud").forEach(function (panel) {
            panel.open = true;
          });
        }
      })();
    </script>
  </body>
</html>
