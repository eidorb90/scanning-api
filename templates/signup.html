{% extends "index.html" %}
{% block content %}
<section class="auth">
  <div class="form-card auth-card">
    <form
      class="stack"
      hx-post="/auth/signup/"
      hx-swap="innerHTML"
      hx-encoding="multipart/form-data"
      hx-target="#errorText">
      <header class="page-head">
        <p class="kicker">Account</p>
        <h1>Sign up</h1>
      </header>

      <label class="field" for="username"></label>
        <span class="label">Username</span>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </label>

      <label class="field" for="password">
        <span class="label">Password</span>
        <input type="password" id="password" name="password" autocomplete="new-password" required>
      </label>     
      
      <label class="field" for="first_name"></label>
        <span class="label">First Name</span>
        <input type="text" id="first_name" name="first_name" autocomplete="first_name" required>
      </label>

      <label class="field" for="last_name">
        <span class="label">Last Name</span>
        <input type="text" id="last_name" name="last_name" autocomplete="last_mame" required>
      </label>

      <label class="field" for="phone">
        <span class="label">Phone Number</span>
        <input type="text" id="phone" name="phone" autocomplete="phone" required>
      </label>

      <label class="field" for="email">
        <span class="label">Email Address</span>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </label>



      <button class="btn btn-primary btn-block" type="submit">Sign up</button>
      <p class="auth-switch">Already registered? <a href="/login/">Log in</a></p>
    </form>
    <div id="errorText" class="notice"></div>
  </div>
</section>
{% endblock %}
