{% extends "index.html" %}
{% block content %}
<section class="page">
  <header class="page-head">
    <p class="kicker">Source footage</p>
    <h1>Your videos</h1>
    <p class="lede">Upload a clip, then use it when you start a scan.</p>
  </header>

  <div class="split">
    <div
      id="userVideos"
      class="panel"
      hx-get="/scanning/get-uploaded-videos/"
      hx-swap="innerHTML"
      hx-trigger="load, videoUploaded from:body"
      hx-target="#userVideos"
      hx-on::after-swap="fillScanVideos()">
      <p class="empty">Loading videos…</p>
    </div>

    <form
      id="videoUpload"
      class="form-card stack"
      hx-post="/scanning/upload-video/"
      hx-encoding="multipart/form-data"
      hx-target="#errorText"
      hx-swap="innerHTML"
      hx-disabled-elt="find button, find input"
      hx-on::after-request="if (event.detail.successful) htmx.trigger(document.body, 'videoUploaded')">
      <p class="section-label">Upload</p>
      <label class="field" for="file-upload">
        <span class="label">Video file</span>
        <input type="file" id="file-upload" name="file" accept="video/*" required>
      </label>
      <div id="uploadProgress" class="upload-progress" hidden>
        <div
          id="uploadProgressTrack"
          class="upload-progress-track"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-labelledby="uploadProgressLabel">
          <div id="uploadProgressBar" class="upload-progress-bar"></div>
        </div>
        <p id="uploadProgressLabel" class="upload-progress-label" aria-live="polite">Uploading 0%</p>
      </div>
      <button class="btn btn-primary" type="submit">Upload file</button>
      <div id="errorText" class="notice"></div>
    </form>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
    function fillScanVideos() {
        var list = document.querySelectorAll("#userVideos li");
        var select = document.getElementById("file_name");
        if (!select) {
            return;
        }
        var current = select.value;
        var names = [];
        list.forEach(function (item) {
            var name = item.textContent.trim();
            if (name && name !== "loading...") {
                names.push(name);
            }
        });

        select.replaceChildren();
        if (names.length === 0) {
            var empty = document.createElement("option");
            empty.value = "";
            empty.textContent = "No videos uploaded";
            select.appendChild(empty);
            return;
        }

        names.forEach(function (name) {
            var option = document.createElement("option");
            option.value = name;
            option.textContent = name;
            select.appendChild(option);
        });
        select.value = names.indexOf(current) !== -1 ? current : names[0];
    }

    (function () {
        var form = document.getElementById("videoUpload");
        var wrap = document.getElementById("uploadProgress");
        var track = document.getElementById("uploadProgressTrack");
        var bar = document.getElementById("uploadProgressBar");
        var label = document.getElementById("uploadProgressLabel");
        if (!form || !wrap || !track || !bar || !label) {
            return;
        }

        var uploadTotal = 0;
        var shownPercent = -1;

        function formatBytes(bytes) {
            if (bytes < 1024 * 1024) {
                return Math.max(1, Math.round(bytes / 1024)) + " KB";
            }
            return (bytes / (1024 * 1024)).toFixed(1) + " MB";
        }

        function show(percent, text, unknown) {
            wrap.hidden = false;
            bar.classList.toggle("is-unknown", unknown);
            bar.style.width = unknown ? "" : percent + "%";
            track.setAttribute("aria-valuenow", unknown ? "0" : String(percent));
            if (text !== label.textContent) {
                label.textContent = text;
            }
        }

        function reset() {
            uploadTotal = 0;
            shownPercent = -1;
            wrap.hidden = true;
            bar.classList.remove("is-unknown");
            bar.style.width = "0%";
            track.setAttribute("aria-valuenow", "0");
            label.textContent = "Uploading 0%";
        }

        form.addEventListener("htmx:beforeRequest", function () {
            uploadTotal = 0;
            shownPercent = -1;
            show(0, "Uploading 0%", false);
        });

        form.addEventListener("htmx:xhr:progress", function (event) {
            var detail = event.detail || {};
            if (!detail.lengthComputable || !detail.total) {
                if (!uploadTotal) {
                    show(0, "Uploading…", true);
                }
                return;
            }
            if (uploadTotal && detail.total < uploadTotal) {
                return;
            }
            uploadTotal = detail.total;
            var percent = Math.min(100, Math.round((detail.loaded / detail.total) * 100));
            if (percent === shownPercent && percent < 100) {
                return;
            }
            shownPercent = percent;
            if (percent >= 100) {
                show(100, "Saving " + formatBytes(detail.total) + "…", false);
                return;
            }
            show(
                percent,
                "Uploading " + percent + "% · " + formatBytes(detail.loaded) + " of " + formatBytes(detail.total),
                false
            );
        });

        form.addEventListener("htmx:afterRequest", reset);
    })();
</script>
{% endblock %}
