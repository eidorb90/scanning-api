[project]
name = "scanning-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "eidorb90", email = "brodieman500@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "open3d>=0.20.0",
    "opencv-python>=5.0.0.93",
    "passlib[bcrypt]>=1.7.4",
    "pycolmap>=4.2.1",
    "pymysql>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
scanning-api = "scanning_api:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
