{% extends "index.html" %}

{% block content %}
    <a href="/" style="position: relative; z-index: 10;">Back</a>
    <h2 style="position: relative; z-index: 10;">{{ scan_name }}</h2>
        <div style="position: relative; z-index: 10;">
            <form hx-post="/scanning/remesh-scan/?scan_name={{ scan_name }} ">
                <div class="form-group">
                    <label for="Depth">Depth:</label>
                    <input type="number" id="depth" name="depth" required value="9">
                </div>
                <div class="form-group">
                    <label for="PW">PW:</label>
                    <input type="number" id="pw" name="pw" required value="2.0"">
                </div>
                <div class="form-group">
                    <label for="Trim">Trim:</label>
                    <input type="number" id="trim" name="trim" required value="5">
                </div>
                <div class="hidden-form-group">
                    <input type="hidden" name="scan_name" id="{{ scan_name }}" value="{{ scan_name }}">
                </div>
                <button>Mesh Scan</button>
                
            </form>
        </div>
        <button style="position: relative; z-index: 10;" hx-delete="/scanning/delete-mesh/?mesh_name={{ scan_name }}">Delete Mesh</button>

    <div id="mesh-controls" style="
        position: fixed; top: 12px; right: 12px; z-index: 10;
        background: rgba(0, 0, 0, 0.6); color: #eee;
        padding: 10px 14px; border-radius: 8px;
        font: 13px/1.8 system-ui, sans-serif;">
        <label><input type="checkbox" id="opt-wireframe"> Wireframe</label><br>
        <label><input type="checkbox" id="opt-rotate"> Auto-rotate camera</label><br>
        <label><input type="checkbox" id="opt-flip" checked> Flip Y/Z (COLMAP)</label><br>
        <button id="opt-reset" style="margin-top: 4px;">Reset view</button>
        <div id="mesh-stats" style="margin-top: 6px; opacity: 0.7;">Loading…</div>
        <div style="margin-top: 8px; max-width: 220px; opacity: 0.85;">
            Drag orbits. Right-drag or Shift-drag pans the camera.
            Scroll zooms. WASD flies, Q/E moves up and down.
        </div>
    </div>
{% endblock %}

{% block scripts %}

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">
    import * as THREE from 'three';
    import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. Scene, camera, renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.01,
        1000
    );
    camera.position.set(0, 0, 5);
    scene.add(camera); // lets the headlight follow the camera

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    const canvas = renderer.domElement;
    // setSize sets the CSS size in screen pixels. Replacing the whole style
    // drops that, and the canvas then uses its device-pixel buffer as its size,
    // so the mesh sits in the bottom-right on a high-DPI screen.
    canvas.style.position = 'fixed';
    canvas.style.inset = '0';
    canvas.style.zIndex = '0';
    canvas.style.touchAction = 'none';
    canvas.style.display = 'block';
    document.body.appendChild(canvas);
    document.body.style.margin = '0';
    document.body.style.overflow = 'hidden';

    // 2. Orbit controls. Left-drag orbits around the target, which looks like
    // the mesh is spinning. Pan and fly move the camera and the target together
    // so the mesh stays put.
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.zoomToCursor = true;
    controls.keyPanSpeed = 40;
    controls.listenToKeyEvents(window);

    // 3. Lighting: soft ambient/hemisphere + a headlight attached to the camera
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));

    const headlight = new THREE.DirectionalLight(0xffffff, 2);
    headlight.position.set(0, 0, 1);
    camera.add(headlight);

    // 4. UI elements
    const wireframeBox = document.getElementById('opt-wireframe');
    const rotateBox = document.getElementById('opt-rotate');
    const flipBox = document.getElementById('opt-flip');
    const resetBtn = document.getElementById('opt-reset');
    const statsEl = document.getElementById('mesh-stats');

    // 5. State
    const pivot = new THREE.Group(); // holds the flip rotation + auto-rotate
    scene.add(pivot);

    let object = null;     // Mesh or Points
    let material = null;
    let fitDistance = 5;

    function applyFlip() {
        // COLMAP uses +Y down / +Z forward; three.js uses +Y up.
        // Leave Y at 0. Auto-rotate orbits the camera, not this group.
        pivot.rotation.x = flipBox.checked ? Math.PI : 0;
        pivot.rotation.y = 0;
    }

    const flyKeys = new Set();
    const flyMove = new THREE.Vector3();
    const flyForward = new THREE.Vector3();
    const flyRight = new THREE.Vector3();
    const flyUp = new THREE.Vector3();

    window.addEventListener('keydown', (event) => {
        if (event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement) {
            return;
        }
        flyKeys.add(event.code);
        if (event.code === 'KeyW' || event.code === 'KeyA' || event.code === 'KeyS' || event.code === 'KeyD' || event.code === 'KeyQ' || event.code === 'KeyE') {
            event.preventDefault();
        }
    });
    window.addEventListener('keyup', (event) => {
        flyKeys.delete(event.code);
    });
    window.addEventListener('blur', () => flyKeys.clear());

    function flyCamera() {
        if (flyKeys.size === 0) {
            return;
        }
        camera.getWorldDirection(flyForward);
        flyRight.crossVectors(flyForward, camera.up).normalize();
        flyUp.copy(camera.up);
        flyMove.set(0, 0, 0);
        const step = Math.max(camera.position.distanceTo(controls.target), 0.1) * 0.02;
        if (flyKeys.has('KeyW')) flyMove.addScaledVector(flyForward, step);
        if (flyKeys.has('KeyS')) flyMove.addScaledVector(flyForward, -step);
        if (flyKeys.has('KeyD')) flyMove.addScaledVector(flyRight, step);
        if (flyKeys.has('KeyA')) flyMove.addScaledVector(flyRight, -step);
        if (flyKeys.has('KeyE')) flyMove.addScaledVector(flyUp, step);
        if (flyKeys.has('KeyQ')) flyMove.addScaledVector(flyUp, -step);
        if (flyMove.lengthSq() === 0) {
            return;
        }
        // Same offset on the camera and the orbit target. The next controls
        // update keeps that offset, so the camera flies instead of snapping back.
        camera.position.add(flyMove);
        controls.target.add(flyMove);
    }

    function resetView() {
        camera.position.set(0, fitDistance * 0.3, fitDistance);
        controls.target.set(0, 0, 0);
        controls.update();
    }

    function fitCameraToGeometry(geometry) {
        geometry.computeBoundingSphere();
        const radius = geometry.boundingSphere.radius || 1;
        const fov = THREE.MathUtils.degToRad(camera.fov);

        fitDistance = (radius / Math.sin(fov / 2)) * 1.1;

        camera.near = radius / 100;
        camera.far = radius * 100;
        camera.updateProjectionMatrix();

        controls.minDistance = radius * 0.1;
        controls.maxDistance = radius * 20;

        resetView();
    }

    // 6. Load the PyCOLMAP Poisson mesh
    const loader = new PLYLoader();
    const scanPath = {{ scan_path | tojson }};

    loader.load(
        scanPath,

        (geometry) => {
            const hasFaces = !!geometry.index;
            const hasColors = geometry.hasAttribute('color');

            // Center the geometry at the origin
            geometry.computeBoundingBox();
            const center = new THREE.Vector3();
            geometry.boundingBox.getCenter(center);
            geometry.translate(-center.x, -center.y, -center.z);

            if (hasFaces) {
                if (!geometry.hasAttribute('normal')) {
                    geometry.computeVertexNormals();
                }

                material = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    vertexColors: hasColors,
                    roughness: 0.8,
                    metalness: 0.0,
                    side: THREE.DoubleSide,
                    flatShading: false
                });

                object = new THREE.Mesh(geometry, material);
            } else {
                // No faces: this is a point cloud, not a mesh. Render as points
                // instead of misinterpreting the vertices as a triangle soup.
                console.warn('PLY has no faces; rendering as points.');
                geometry.computeBoundingSphere();

                material = new THREE.PointsMaterial({
                    color: 0xffffff,
                    vertexColors: hasColors,
                    size: geometry.boundingSphere.radius * 0.005,
                    sizeAttenuation: true
                });

                object = new THREE.Points(geometry, material);
                wireframeBox.disabled = true;
            }

            pivot.add(object);
            applyFlip();
            fitCameraToGeometry(geometry);

            const vertCount = geometry.attributes.position.count;
            const triCount = hasFaces ? geometry.index.count / 3 : 0;

            statsEl.innerHTML = hasFaces
                ? `${vertCount.toLocaleString()} vertices<br>${triCount.toLocaleString()} triangles<br>Colors: ${hasColors ? 'yes' : 'no'}`
                : `${vertCount.toLocaleString()} points (no faces)<br>Colors: ${hasColors ? 'yes' : 'no'}`;

            console.log('Vertices:', vertCount);
            console.log('Triangles:', triCount);
            console.log('Has colors:', hasColors);
        },

        (xhr) => {
            if (xhr.total > 0) {
                const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
                statsEl.textContent = `Loading… ${pct}%`;
            }
        },

        (error) => {
            console.error('Error loading PyCOLMAP mesh:', error);
            statsEl.textContent = 'Failed to load mesh';
        }
    );

    // 7. Control handlers
    wireframeBox.addEventListener('change', () => {
        if (material && 'wireframe' in material) {
            material.wireframe = wireframeBox.checked;
        }
    });
    rotateBox.addEventListener('change', () => {
        controls.autoRotate = rotateBox.checked;
    });
    flipBox.addEventListener('change', applyFlip);
    resetBtn.addEventListener('click', resetView);

    // 8. Animation loop
    function animate() {
        requestAnimationFrame(animate);
        flyCamera();
        controls.update();
        renderer.render(scene, camera);
    }

    animate();

    // 9. Handle window resizing
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

</script>

{% endblock %}
